name: Clinic Appointment API CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Django application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clinic-appointment-api

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-test-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: clinic-appointment-api/requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run appointment tests
        run: python manage.py test appointments

  deploy:
    name: Deploy to Render
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK_URL"